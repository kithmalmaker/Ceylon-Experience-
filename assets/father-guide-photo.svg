<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F5132" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#082A1B" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4A261"/>
      <stop offset="100%" stop-color="#E76F51"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Decorative Ring -->
  <circle cx="200" cy="150" r="75" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="6 6"/>
  
  <!-- Guide Silhouette / Avatar -->
  <circle cx="200" cy="130" r="45" fill="#E2E8F0"/>
  <path d="M120 235 C120 185, 280 185, 280 235 Z" fill="#E2E8F0"/>
  
  <!-- Camera / Badge Icon -->
  <circle cx="245" cy="175" r="22" fill="#F4A261" stroke="#082A1B" stroke-width="3"/>
  <text x="245" y="182" font-family="Arial, sans-serif" font-size="16" fill="#082A1B" font-weight="bold" text-anchor="middle">📷</text>
  
  <!-- Labels -->
  <text x="200" y="295" font-family="'Outfit', sans-serif, Arial" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Senior Cultural Guide</text>
  <text x="200" y="325" font-family="'Plus Jakarta Sans', sans-serif, Arial" font-size="16" font-weight="600" fill="#F4A261" text-anchor="middle">French &amp; German Specialist</text>
  
  <!-- Flag Badge -->
  <rect x="140" y="345" width="120" height="28" rx="14" fill="rgba(255,255,255,0.15)"/>
  <text x="200" y="364" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🇫🇷 FR &amp; 🇩🇪 DE</text>
</svg>